# Clindar.eu — Netlify configuration.
#
# The scanner is built from the vendor/scanner submodule and copied into the
# publish directory under scanner/. It is deliberately NOT a proxy rewrite to a
# second site: Netlify does not apply custom headers to proxied content, which
# would move the scanner's CSP out of this repo's control.

[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  # The scanner's package.json requires node >= 20.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Headers.
#
# Netlify header rules are global across builds and cannot be scoped per branch
# or deploy context, but they can be scoped by path, which is what separates the
# marketing site from the scanner below. Rules are listed general to specific;
# a later matching rule overrides an earlier one for the same header name.
# ---------------------------------------------------------------------------

# Baseline for the marketing site. It loads Google Fonts and Plausible, so its
# policy is necessarily looser than the scanner's — hence two policies, not one.
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://plausible.io; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://plausible.io"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# The scanner's privacy page. Same policy as the marketing baseline above with
# both Google Fonts origins removed, because this page self-hosts its faces —
# see css/fonts.css.
#
# The page is where a reader goes to check the claim that the scanner sends
# their Define-XML nowhere, and it is meant to be read with devtools open. A
# request to fonts.googleapis.com in that network panel is the reader's first
# result, and it is a third party receiving their IP address on the page
# promising nothing is sent to third parties. Self-hosting removes the request;
# this block is what stops it coming back. A re-added <link> to Google Fonts
# now fails visibly in the console instead of quietly restoring the thing the
# page exists to deny.
#
# The rest of the site still links Google Fonts and the baseline above still
# permits it. That is a deliberate split, not an oversight: this is the only
# page whose argument its own network activity can contradict.
#
# What this does NOT tighten, and could: script-src still permits plausible.io
# here, inherited from the baseline, though this page loads no analytics and
# says so. Narrowing it is a separate decision from self-hosting the fonts.
[[headers]]
  for = "/impact/privacy/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://plausible.io; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://plausible.io"

# The scanner. With connect-src 'self' the browser blocks every third-party
# destination, so the only endpoint this page's JavaScript can address is a path
# on this domain, and the only path that accepts anything is the subscribe
# function, which takes an email address.
#
# What that does NOT do is forbid a same-origin request. The header bounds the
# destinations to one; it is the scanner's own code — which calls fetch nowhere
# — that keeps the Define-XML out of the one that remains. Both halves are
# load-bearing, and /impact/privacy/ says so in those terms rather than crediting
# the policy with the whole thing.
#
# 'unsafe-inline' is deliberately absent from style-src. Every rule the scanner
# page uses is in a same-origin stylesheet — Vite emits one file and links it,
# the capture widget brings its own, and no component sets a style attribute or
# builds a <style> element. The build checks that rather than trusting it: see
# assertScannerStylesMatchPolicy in scripts/build.mjs, which fails the build if
# this directive says 'self' and the produced page still needs more.
#
# The downloaded report is a different document and is NOT governed by this. It
# is written to a Blob, saved to disk, and opened from the filesystem, where no
# policy of ours reaches it; its inline styles are what make a single saved file
# render on its own, which is the whole point of it.
#
# It stays a different document only while it is downloaded. A blob: URL opened
# in a tab inherits the policy of the page that created it, so the report would
# arrive under this one and render unstyled. If it ever wants an in-tab preview,
# that preview gets its own document and its own policy — not this directive
# reopened for every visitor to buy a preview nobody asked for.
#
# The policy half is still a product claim and not a hardening detail: 'self' is
# exactly as far as this may ever be relaxed, and this string is also the source
# the build copies into the scanner's own <meta> tag (see scripts/build.mjs).
[[headers]]
  for = "/scanner/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"

# HTML is re-fetched every time so a deploy is visible immediately.
[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/scanner/index.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite emits content-hashed filenames, so these are safe to pin forever.
[[headers]]
  for = "/scanner/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The capture widget is copied in from widget/ and is not content-hashed, so it
# has to be revalidated or a fix to it would sit in caches behind the HTML.
[[headers]]
  for = "/scanner/scanner-capture.*"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The subscribe endpoint. Nothing about a POST of an email address should ever
# be held anywhere between the browser and the function.
[[headers]]
  for = "/.netlify/functions/*"

  [headers.values]
    Cache-Control = "no-store"
