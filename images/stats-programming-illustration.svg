<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <filter id="shadowP">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="440" fill="url(#bgP)"/>

  <!-- Left panel: code editor -->
  <rect x="30" y="30" width="370" height="380" rx="12" fill="#1e293b" filter="url(#shadowP)"/>
  <!-- Editor chrome -->
  <rect x="30" y="30" width="370" height="36" rx="12" fill="#0f172a"/>
  <rect x="30" y="52" width="370" height="14" fill="#0f172a"/>
  <!-- Traffic lights -->
  <circle cx="54" cy="48" r="5" fill="#ef4444"/>
  <circle cx="70" cy="48" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="48" r="5" fill="#22c55e"/>
  <!-- Filename tabs -->
  <rect x="110" y="38" width="100" height="20" rx="4" fill="#1e293b"/>
  <text x="160" y="51" text-anchor="middle" fill="#94a3b8" font-size="10">adam_adlb.sas</text>
  <rect x="215" y="38" width="90" height="20" rx="4" fill="#334155"/>
  <text x="260" y="51" text-anchor="middle" fill="#64748b" font-size="10">adsl.R</text>

  <!-- Line numbers + code -->
  <g font-family="JetBrains Mono, monospace" font-size="10">
    <!-- Line numbers -->
    <g fill="#475569">
      <text x="46" y="85">01</text>
      <text x="46" y="100">02</text>
      <text x="46" y="115">03</text>
      <text x="46" y="130">04</text>
      <text x="46" y="145">05</text>
      <text x="46" y="160">06</text>
      <text x="46" y="175">07</text>
      <text x="46" y="190">08</text>
      <text x="46" y="205">09</text>
      <text x="46" y="220">10</text>
      <text x="46" y="235">11</text>
      <text x="46" y="250">12</text>
      <text x="46" y="265">13</text>
      <text x="46" y="280">14</text>
      <text x="46" y="295">15</text>
      <text x="46" y="310">16</text>
      <text x="46" y="325">17</text>
      <text x="46" y="340">18</text>
      <text x="46" y="355">19</text>
      <text x="46" y="370">20</text>
    </g>

    <!-- SAS code (syntax colored) -->
    <!-- Line 1 -->
    <text x="72" y="85" fill="#94a3b8">/* ADLB — Laboratory Analysis Dataset */</text>
    <!-- Line 2 blank -->
    <!-- Line 3 -->
    <text x="72" y="115"><tspan fill="#c084fc">%macro</tspan><tspan fill="#e2e8f0"> derive_lbbase</tspan><tspan fill="#fbbf24">(</tspan><tspan fill="#fb923c">lbtest=</tspan><tspan fill="#fbbf24">)</tspan><tspan fill="#e2e8f0">;</tspan></text>
    <!-- Line 4 -->
    <text x="72" y="130" fill="#e2e8f0">  <tspan fill="#60a5fa">data</tspan><tspan fill="#e2e8f0"> adlb_base;</tspan></text>
    <!-- Line 5 -->
    <text x="72" y="145" fill="#e2e8f0">    <tspan fill="#60a5fa">set</tspan><tspan fill="#e2e8f0"> sdtm.lb;</tspan></text>
    <!-- Line 6 -->
    <text x="72" y="160" fill="#e2e8f0">    <tspan fill="#60a5fa">where</tspan><tspan fill="#e2e8f0"> LBTESTCD = </tspan><tspan fill="#34d399">"&amp;lbtest."</tspan><tspan fill="#e2e8f0">;</tspan></text>
    <!-- Line 7 blank -->
    <!-- Line 8 highlighted (active) -->
    <rect x="64" y="181" width="322" height="14" rx="2" fill="#1d4ed8" fill-opacity="0.3"/>
    <text x="72" y="192" fill="#e2e8f0">    AVAL = <tspan fill="#fbbf24">input</tspan><tspan fill="#e2e8f0">(LBORRES, </tspan><tspan fill="#34d399">best12.</tspan><tspan fill="#e2e8f0">);</tspan></text>
    <!-- cursor -->
    <rect x="267" y="182" width="2" height="12" fill="#3b82f6" opacity="0.9"/>
    <!-- Line 9 -->
    <text x="72" y="207" fill="#e2e8f0">    AVALU = LBORRESU;</text>
    <!-- Line 10 -->
    <text x="72" y="222" fill="#e2e8f0">    PARAMCD = LBTESTCD;</text>
    <!-- Line 11 -->
    <text x="72" y="237" fill="#e2e8f0">    PARAM = LBTEST;</text>
    <!-- Line 12 blank -->
    <!-- Line 13 -->
    <text x="72" y="265" fill="#e2e8f0">    <tspan fill="#60a5fa">if</tspan><tspan fill="#e2e8f0"> VISITNUM = </tspan><tspan fill="#fb923c">1</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#60a5fa">then</tspan><tspan fill="#e2e8f0"> do;</tspan></text>
    <!-- Line 14 -->
    <text x="72" y="280" fill="#e2e8f0">      BASE = AVAL;</text>
    <!-- Line 15 -->
    <text x="72" y="295" fill="#e2e8f0">      ABLFL = <tspan fill="#34d399">"Y"</tspan><tspan fill="#e2e8f0">;</tspan></text>
    <!-- Line 16 -->
    <text x="72" y="310" fill="#e2e8f0">    <tspan fill="#60a5fa">end</tspan><tspan fill="#e2e8f0">;</tspan></text>
    <!-- Line 17 blank -->
    <!-- Line 18 -->
    <text x="72" y="340" fill="#e2e8f0">    CHG = AVAL - BASE;</text>
    <!-- Line 19 -->
    <text x="72" y="355" fill="#e2e8f0">    PCHG = <tspan fill="#fbbf24">round</tspan><tspan fill="#e2e8f0">(CHG / BASE * </tspan><tspan fill="#fb923c">100</tspan><tspan fill="#e2e8f0">, .</tspan><tspan fill="#fb923c">01</tspan><tspan fill="#e2e8f0">);</tspan></text>
    <!-- Line 20 -->
    <text x="72" y="370" fill="#e2e8f0">  <tspan fill="#60a5fa">run</tspan><tspan fill="#e2e8f0">;</tspan></text>
  </g>

  <!-- Status bar -->
  <rect x="30" y="390" width="370" height="20" rx="0" fill="#0f172a"/>
  <rect x="30" y="398" width="370" height="12" fill="#0f172a"/>
  <text x="50" y="404" fill="#22c55e" font-size="9">● SAS 9.4</text>
  <text x="120" y="404" fill="#60a5fa" font-size="9">SDTM v3.4</text>
  <text x="185" y="404" fill="#94a3b8" font-size="9">ADaM IG v1.3</text>
  <text x="330" y="404" fill="#475569" font-size="9">Ln 8, Col 36</text>

  <!-- Right panel: output charts -->
  <rect x="418" y="30" width="352" height="380" rx="12" fill="#ffffff" filter="url(#shadowP)"/>
  <!-- Panel header -->
  <rect x="418" y="30" width="352" height="36" rx="12" fill="#f8fafc"/>
  <rect x="418" y="52" width="352" height="14" fill="#f8fafc"/>
  <text x="594" y="52" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">Output Preview</text>

  <!-- Chart title -->
  <text x="594" y="87" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">Mean Change from Baseline — ALB (g/dL)</text>
  <text x="594" y="101" text-anchor="middle" fill="#64748b" font-size="9">Treatment vs. Placebo · Weeks 4, 8, 12, 24</text>

  <!-- Chart area -->
  <rect x="440" y="110" width="308" height="160" rx="4" fill="#f8fafc"/>

  <!-- Y-axis labels -->
  <g fill="#94a3b8" font-size="9" text-anchor="end">
    <text x="465" y="118">+0.6</text>
    <text x="465" y="142">+0.4</text>
    <text x="465" y="166">+0.2</text>
    <text x="465" y="190">0.0</text>
    <text x="465" y="214">-0.2</text>
    <text x="465" y="238">-0.4</text>
    <text x="465" y="260">-0.6</text>
  </g>

  <!-- Grid lines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="468" y1="114" x2="742" y2="114"/>
    <line x1="468" y1="138" x2="742" y2="138"/>
    <line x1="468" y1="162" x2="742" y2="162"/>
    <line x1="468" y1="186" x2="742" y2="186"/>
    <line x1="468" y1="210" x2="742" y2="210"/>
    <line x1="468" y1="234" x2="742" y2="234"/>
    <line x1="468" y1="258" x2="742" y2="258"/>
  </g>

  <!-- Zero line -->
  <line x1="468" y1="186" x2="742" y2="186" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- X-axis labels -->
  <g fill="#94a3b8" font-size="9" text-anchor="middle">
    <text x="510" y="272">Wk 4</text>
    <text x="578" y="272">Wk 8</text>
    <text x="646" y="272">Wk 12</text>
    <text x="714" y="272">Wk 24</text>
  </g>

  <!-- Treatment line (blue - improving = going up) -->
  <polyline points="510,162 578,150 646,138 714,126"
    fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data points treatment -->
  <circle cx="510" cy="162" r="4" fill="#3b82f6"/>
  <circle cx="578" cy="150" r="4" fill="#3b82f6"/>
  <circle cx="646" cy="138" r="4" fill="#3b82f6"/>
  <circle cx="714" cy="126" r="4" fill="#3b82f6"/>

  <!-- Placebo line (gray - slight decline) -->
  <polyline points="510,186 578,192 646,196 714,202"
    fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,3"/>
  <!-- Data points placebo -->
  <circle cx="510" cy="186" r="4" fill="#94a3b8"/>
  <circle cx="578" cy="192" r="4" fill="#94a3b8"/>
  <circle cx="646" cy="196" r="4" fill="#94a3b8"/>
  <circle cx="714" cy="202" r="4" fill="#94a3b8"/>

  <!-- Confidence intervals (treatment) -->
  <g stroke="#3b82f6" stroke-opacity="0.25" stroke-width="1">
    <line x1="510" y1="154" x2="510" y2="170"/>
    <line x1="578" y1="140" x2="578" y2="160"/>
    <line x1="646" y1="126" x2="646" y2="150"/>
    <line x1="714" y1="112" x2="714" y2="140"/>
  </g>

  <!-- Legend -->
  <line x1="454" y1="288" x2="474" y2="288" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="464" cy="288" r="3" fill="#3b82f6"/>
  <text x="478" y="292" fill="#374151" font-size="9">Treatment (n=48)</text>
  <line x1="560" y1="288" x2="580" y2="288" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="570" cy="288" r="3" fill="#94a3b8"/>
  <text x="584" y="292" fill="#374151" font-size="9">Placebo (n=46)</text>

  <!-- p-value badge -->
  <rect x="670" y="280" width="88" height="18" rx="9" fill="#dbeafe"/>
  <text x="714" y="293" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="700">p &lt; 0.001</text>

  <!-- Stats summary table -->
  <rect x="440" y="308" width="308" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Header -->
  <rect x="440" y="308" width="308" height="20" rx="6" fill="#f1f5f9"/>
  <rect x="440" y="320" width="308" height="8" fill="#f1f5f9"/>
  <g fill="#64748b" font-size="9" font-weight="700">
    <text x="470" y="323">PARAMETER</text>
    <text x="570" y="323">TREAT</text>
    <text x="630" y="323">PLACEBO</text>
    <text x="700" y="323">P-VALUE</text>
  </g>
  <g fill="#374151" font-size="9">
    <text x="455" y="342">ALB Mean Δ (95% CI)</text>
    <text x="565" y="342">+0.48 (0.36–0.60)</text>
    <text x="628" y="342">-0.12 (-0.24–0.00)</text>
    <text x="700" y="342" fill="#1d4ed8" font-weight="600">&lt;0.001</text>
    <line x1="440" y1="350" x2="748" y2="350" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="455" y="364">ALT Mean Δ (95% CI)</text>
    <text x="565" y="364">-3.2 (-5.1– -1.3)</text>
    <text x="628" y="364">+0.8 (-1.2–2.8)</text>
    <text x="700" y="364" fill="#1d4ed8" font-weight="600">0.003</text>
    <line x1="440" y1="372" x2="748" y2="372" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="455" y="386">HGB Mean Δ (95% CI)</text>
    <text x="565" y="386">+0.31 (0.18–0.44)</text>
    <text x="628" y="386">-0.04 (-0.17–0.09)</text>
    <text x="700" y="386" fill="#1d4ed8" font-weight="600">0.001</text>
  </g>

  <!-- Tool badges -->
  <g text-anchor="middle">
    <rect x="440" y="400" width="70" height="20" rx="10" fill="#fef3c7"/>
    <text x="475" y="413" fill="#92400e" font-size="9" font-weight="700">SAS 9.4</text>
    <rect x="518" y="400" width="50" height="20" rx="10" fill="#f0fdf4"/>
    <text x="543" y="413" fill="#15803d" font-size="9" font-weight="700">R 4.3</text>
    <rect x="576" y="400" width="78" height="20" rx="10" fill="#eff6ff"/>
    <text x="615" y="413" fill="#1d4ed8" font-size="9" font-weight="700">Python 3.12</text>
    <rect x="662" y="400" width="86" height="20" rx="10" fill="#f5f3ff"/>
    <text x="705" y="413" fill="#6d28d9" font-size="9" font-weight="700">ADaM IG 1.3</text>
  </g>
</svg>
