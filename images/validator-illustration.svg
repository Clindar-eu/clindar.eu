  <!-- Score circle -->
  <circle cx="147" cy="148" r="50" fill="none" stroke="#e2e8f0" stroke-width="10"/>
  <!-- Score arc: 86% = 0.86 * 2π * 50 = 270 degrees of dasharray=314, offset=44 -->
  <circle cx="147" cy="148" r="50" fill="none" stroke="#22c55e" stroke-width="10"
    stroke-dasharray="270 44" stroke-linecap="round"
    transform="rotate(-90 147 148)"/>
  <text x="147" y="143" text-anchor="middle" fill="#0f172a" font-size="24" font-weight="700">86%</text>
  <text x="147" y="160" text-anchor="middle" fill="#64748b" font-size="10">Conformance</text>

  <!-- Score label -->
  <text x="147" y="220" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">study-0042 / LBVS</text>
  <text x="147" y="236" text-anchor="middle" fill="#64748b" font-size="10">SDTM v3.4 · 1,840 rows</text>

  <!-- Error summary -->
  <rect x="64" y="252" width="166" height="22" rx="4" fill="#fef2f2"/>
  <rect x="64" y="252" width="3" height="22" rx="1" fill="#ef4444"/>
  <text x="76" y="267" fill="#ef4444" font-size="11" font-weight="600">3 errors</text>
  <rect x="64" y="280" width="166" height="22" rx="4" fill="#fffbeb"/>
  <rect x="64" y="280" width="3" height="22" rx="1" fill="#f59e0b"/>
