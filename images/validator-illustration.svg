  <g fill="#374151" font-size="10">
    <text x="268" y="158" font-family="JetBrains Mono, monospace" fill="#ef4444" font-weight="600">001-001</text>
    <text x="348" y="158">ALB</text>
    <text x="418" y="158">4.2</text>
    <text x="478" y="158">g/dL</text>
