  <rect x="254" y="196" width="494" height="28" fill="#fffbeb"/>
  <rect x="254" y="196" width="3" height="28" fill="#f59e0b"/>
  <g fill="#374151" font-size="10">
    <text x="268" y="214" font-family="JetBrains Mono, monospace">001-002</text>
    <text x="348" y="214">GLUC</text>
    <text x="418" y="214">92</text>
    <text x="478" y="214">mg/dL</text>
    <text x="548" y="214">1</text>
    <rect x="610" y="201" width="58" height="16" rx="8" fill="#fef3c7"/>
    <text x="639" y="213" text-anchor="middle" fill="#b45309" font-size="9" font-weight="600">WARNING</text>
    <text x="695" y="214" fill="#b45309" font-size="9">CT0082</text>
  </g>

  <!-- Row 4: pass -->
  <g fill="#374151" font-size="10">
    <text x="268" y="242" font-family="JetBrains Mono, monospace">001-002</text>
    <text x="348" y="242">HGB</text>
    <text x="418" y="242">13.9</text>
    <text x="478" y="242">g/dL</text>
    <text x="548" y="242">2</text>
    <rect x="614" y="229" width="52" height="16" rx="8" fill="#dcfce7"/>
    <text x="640" y="241" text-anchor="middle" fill="#15803d" font-size="9" font-weight="600">PASS</text>
    <text x="695" y="242" fill="#94a3b8" font-size="9">—</text>
  </g>
  <line x1="254" y1="252" x2="748" y2="252" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Row 5: error -->
  <rect x="254" y="252" width="494" height="28" fill="#fef2f2"/>
  <rect x="254" y="252" width="3" height="28" fill="#ef4444"/>
  <g fill="#374151" font-size="10">
    <text x="268" y="270" font-family="JetBrains Mono, monospace" fill="#ef4444" font-weight="600">001-003</text>
    <text x="348" y="270">CREAT</text>
    <text x="418" y="270">0.9</text>
    <text x="478" y="270">mg/dL</text>
    <text x="548" y="270">—</text>
    <rect x="614" y="257" width="52" height="16" rx="8" fill="#fecaca"/>
    <text x="640" y="269" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="600">ERROR</text>
    <text x="695" y="270" fill="#ef4444" font-size="9">CG0015</text>
  </g>

  <!-- Row 6: pass -->
  <g fill="#374151" font-size="10">
    <text x="268" y="298" font-family="JetBrains Mono, monospace">001-003</text>
    <text x="348" y="298">BILI</text>
    <text x="418" y="298">0.7</text>
    <text x="478" y="298">mg/dL</text>
    <text x="548" y="298">2</text>
    <rect x="614" y="285" width="52" height="16" rx="8" fill="#dcfce7"/>
    <text x="640" y="297" text-anchor="middle" fill="#15803d" font-size="9" font-weight="600">PASS</text>
    <text x="695" y="298" fill="#94a3b8" font-size="9">—</text>
  </g>
  <line x1="254" y1="308" x2="748" y2="308" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Expanded error explanation panel -->
  <rect x="254" y="310" width="494" height="76" rx="0" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
  <rect x="254" y="310" width="494" height="1" fill="#fecaca"/>
  <!-- Error icon -->
  <circle cx="274" cy="332" r="10" fill="#fecaca"/>
  <text x="274" y="337" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="700">!</text>
  <text x="295" y="330" fill="#0f172a" font-size="11" font-weight="700">CG0015 — Required variable VISITNUM is null</text>
  <text x="295" y="345" fill="#64748b" font-size="10">VISITNUM must be populated for all records in the LB domain. Found 14 rows</text>
  <text x="295" y="358" fill="#64748b" font-size="10">with missing values. Per SDTM IG 3.4, section 7.2 (Timing Variables).</text>
  <!-- Fix suggestion -->
  <rect x="295" y="366" width="220" height="16" rx="8" fill="#dbeafe"/>
  <text x="405" y="378" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="600">Suggested fix: Populate from VISIT variable mapping</text>
</svg>
