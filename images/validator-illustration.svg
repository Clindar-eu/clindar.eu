<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4ff"/>
      <stop offset="100%" style="stop-color:#e8eef8"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#94a3b8" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#94a3b8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="440" fill="url(#bg2)"/>

  <!-- Browser chrome -->
  <rect x="40" y="30" width="720" height="380" rx="12" fill="#ffffff" filter="url(#shadow2)"/>
  <!-- Browser top bar -->
  <rect x="40" y="30" width="720" height="40" rx="12" fill="#f1f5f9"/>
  <rect x="40" y="56" width="720" height="14" fill="#f1f5f9"/>
  <!-- Traffic lights -->
  <circle cx="68" cy="50" r="6" fill="#ef4444"/>
  <circle cx="88" cy="50" r="6" fill="#f59e0b"/>
  <circle cx="108" cy="50" r="6" fill="#22c55e"/>
  <!-- URL bar -->
  <rect x="140" y="40" width="380" height="20" rx="10" fill="#e2e8f0"/>
  <text x="155" y="54" fill="#64748b" font-size="10">app.clindar.eu/validate/study-0042</text>
  <!-- App label -->
  <text x="595" y="54" fill="#3b82f6" font-size="11" font-weight="700">Clindar</text>

  <!-- Main content area -->
  <!-- Left panel: file info + score -->
