<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1f3d"/>
      <stop offset="100%" style="stop-color:#1a3060"/>
    </linearGradient>
    <filter id="shadowS">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glowS">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sdtmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="adamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="tlfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e7490"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="defineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#047857"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="440" fill="url(#bgS)"/>

  <!-- Background dots -->
  <g fill="#ffffff" fill-opacity="0.03">
    <circle cx="100" cy="100" r="80"/>
    <circle cx="700" cy="350" r="100"/>
    <circle cx="750" cy="80" r="60"/>
  </g>

  <!-- Title -->
  <text x="400" y="48" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600" letter-spacing="1">END-TO-END CDISC SUBMISSION PACKAGE</text>

  <!-- SDTM Card -->
  <rect x="50" y="70" width="155" height="290" rx="10" fill="url(#sdtmGrad)" filter="url(#shadowS)"/>
  <!-- Card page fold -->
  <polygon points="185,70 205,70 205,90 185,90" fill="#1e3a8a"/>
  <polygon points="185,70 205,90 185,90" fill="#1e40af"/>
  <!-- Card header -->
  <text x="127" y="105" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="700" letter-spacing="1">SDTM</text>
  <text x="127" y="120" text-anchor="middle" fill="#93c5fd" font-size="9">Study Data</text>
  <text x="127" y="132" text-anchor="middle" fill="#93c5fd" font-size="9">Tabulation Model</text>
  <!-- Divider -->
  <line x1="65" y1="142" x2="190" y2="142" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
  <!-- Domain list -->
  <g fill="#bfdbfe" font-size="10">
    <text x="75" y="158">DM  — Demographics</text>
    <text x="75" y="173">AE  — Adverse Events</text>
    <text x="75" y="188">LB  — Laboratory</text>
    <text x="75" y="203">VS  — Vital Signs</text>
    <text x="75" y="218">CM  — Medications</text>
    <text x="75" y="233">EX  — Exposure</text>
    <text x="75" y="248">MH  — Med History</text>
    <text x="75" y="263">DS  — Disposition</text>
    <text x="75" y="278">PE  — Physical Exam</text>
  </g>
  <text x="127" y="298" text-anchor="middle" fill="#93c5fd" font-size="9" opacity="0.8">+ 19 more domains</text>
  <!-- Count badge -->
  <rect x="80" y="308" width="94" height="22" rx="11" fill="#1e3a8a"/>
  <text x="127" y="323" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">28 datasets</text>
  <!-- Tick -->
  <circle cx="127" cy="348" r="14" fill="#dcfce7"/>
  <text x="127" y="354" text-anchor="middle" fill="#15803d" font-size="16" font-weight="700">✓</text>

  <!-- ADaM Card -->
  <rect x="222" y="70" width="155" height="290" rx="10" fill="url(#adamGrad)" filter="url(#shadowS)"/>
  <polygon points="357,70 377,70 377,90 357,90" fill="#3730a3"/>
  <polygon points="357,70 377,90 357,90" fill="#4338ca"/>
  <text x="299" y="105" text-anchor="middle" fill="#e0e7ff" font-size="11" font-weight="700" letter-spacing="1">ADaM</text>
  <text x="299" y="120" text-anchor="middle" fill="#c7d2fe" font-size="9">Analysis Data</text>
  <text x="299" y="132" text-anchor="middle" fill="#c7d2fe" font-size="9">Model</text>
  <line x1="237" y1="142" x2="362" y2="142" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
  <g fill="#e0e7ff" font-size="10">
    <text x="247" y="158">ADSL — Subject Level</text>
    <text x="247" y="173">ADAE — Adverse Events</text>
    <text x="247" y="188">ADLB — Laboratory</text>
    <text x="247" y="203">ADVS — Vital Signs</text>
    <text x="247" y="218">ADCM — Medications</text>
    <text x="247" y="233">ADEX — Exposure</text>
    <text x="247" y="248">ADTTE — Time-to-Event</text>
    <text x="247" y="263">ADEFF — Efficacy</text>
  </g>
  <text x="299" y="283" text-anchor="middle" fill="#c7d2fe" font-size="9" opacity="0.8">+ 4 more datasets</text>
  <rect x="252" y="295" width="94" height="22" rx="11" fill="#3730a3"/>
  <text x="299" y="310" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="700">12 datasets</text>
  <text x="299" y="340" text-anchor="middle" fill="#c7d2fe" font-size="9">Analysis specs</text>
  <circle cx="299" cy="348" r="14" fill="#dcfce7"/>
  <text x="299" y="354" text-anchor="middle" fill="#15803d" font-size="16" font-weight="700">✓</text>

  <!-- TLF Card -->
  <rect x="394" y="70" width="155" height="290" rx="10" fill="url(#tlfGrad)" filter="url(#shadowS)"/>
  <polygon points="529,70 549,70 549,90 529,90" fill="#0c4a6e"/>
  <polygon points="529,70 549,90 529,90" fill="#0e7490"/>
  <text x="471" y="105" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="700" letter-spacing="1">TLF</text>
  <text x="471" y="120" text-anchor="middle" fill="#7dd3fc" font-size="9">Tables · Listings</text>
  <text x="471" y="132" text-anchor="middle" fill="#7dd3fc" font-size="9">Figures</text>
  <line x1="409" y1="142" x2="534" y2="142" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1"/>
  <g fill="#bae6fd" font-size="10">
    <text x="419" y="158">T14.1 — Demographics</text>
    <text x="419" y="173">T14.2 — Efficacy summary</text>
    <text x="419" y="188">T14.3 — AE summary</text>
    <text x="419" y="203">T14.4 — Lab summary</text>
    <text x="419" y="218">L16.1 — Subject listing</text>
    <text x="419" y="233">L16.2 — AE listing</text>
    <text x="419" y="248">F14.1 — KM survival</text>
    <text x="419" y="263">F14.2 — Forest plot</text>
  </g>
  <text x="471" y="283" text-anchor="middle" fill="#7dd3fc" font-size="9" opacity="0.8">+ 34 more outputs</text>
  <rect x="424" y="295" width="94" height="22" rx="11" fill="#0c4a6e"/>
  <text x="471" y="310" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="700">42 outputs</text>
  <text x="471" y="340" text-anchor="middle" fill="#7dd3fc" font-size="9">RTF + PDF formats</text>
  <circle cx="471" cy="348" r="14" fill="#dcfce7"/>
  <text x="471" y="354" text-anchor="middle" fill="#15803d" font-size="16" font-weight="700">✓</text>

  <!-- Define-XML Card -->
  <rect x="566" y="70" width="155" height="290" rx="10" fill="url(#defineGrad)" filter="url(#shadowS)"/>
  <polygon points="701,70 721,70 721,90 701,90" fill="#064e3b"/>
  <polygon points="701,70 721,90 701,90" fill="#047857"/>
  <text x="643" y="105" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="700" letter-spacing="1">Define-XML</text>
  <text x="643" y="120" text-anchor="middle" fill="#6ee7b7" font-size="9">Metadata</text>
  <text x="643" y="132" text-anchor="middle" fill="#6ee7b7" font-size="9">Document</text>
  <line x1="581" y1="142" x2="706" y2="142" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <g fill="#a7f3d0" font-size="10">
    <text x="591" y="158">Variable definitions</text>
    <text x="591" y="173">Codelist metadata</text>
    <text x="591" y="188">Dataset structure</text>
    <text x="591" y="203">Computation methods</text>
    <text x="591" y="218">Comments &amp; notes</text>
    <text x="591" y="233">Reviewer's Guide</text>
    <text x="591" y="248">Analysis Results</text>
    <text x="591" y="263">Origin info</text>
  </g>
  <text x="643" y="283" text-anchor="middle" fill="#6ee7b7" font-size="9" opacity="0.8">v2.1 compliant</text>
  <rect x="596" y="295" width="94" height="22" rx="11" fill="#064e3b"/>
  <text x="643" y="310" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="700">1 XML file</text>
  <text x="643" y="340" text-anchor="middle" fill="#6ee7b7" font-size="9">Auto-generated</text>
  <circle cx="643" cy="348" r="14" fill="#dcfce7"/>
  <text x="643" y="354" text-anchor="middle" fill="#15803d" font-size="16" font-weight="700">✓</text>

  <!-- Bottom: filed to badges -->
  <text x="400" y="390" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="500" opacity="0.8">Filed to:</text>
  <rect x="300" y="400" width="90" height="28" rx="14" fill="#1e3a6e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="345" y="419" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">FDA</text>
  <rect x="408" y="400" width="90" height="28" rx="14" fill="#1e3a6e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="453" y="419" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">EMA</text>
</svg>
